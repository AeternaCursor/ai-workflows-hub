name: Deploy Timeline to GitHub Pages

# 将 timeline/ 目录发布到 GitHub Pages：
# https://aeternacursor.github.io/ai-workflows-hub/
# 首次部署：启用 Pages 并选择 "GitHub Actions" 作为 Source（已通过 API 设置 build_type=workflow）

on:
  push:
    branches: [main]
    paths: ["timeline/**"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload timeline artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: timeline

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
