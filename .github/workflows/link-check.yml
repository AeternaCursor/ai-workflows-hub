name: Link Health Check

# 每周二 10:00（北京时间 = UTC 周二 02:00）用 lychee 检查所有 Markdown 中的外链。
# 确认存在失效链接时自动创建 Issue（查重固定标题）；全部恢复健康时自动关闭旧报告。

on:
  schedule:
    - cron: "0 2 * * 2"
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        id: lychee
        with:
          fail: false
          format: markdown
          output: lychee-report.md
          args: >-
            --verbose --no-progress --max-retries 2
            './**/*.md'

      - name: Create or close issue
        uses: actions/github-script@v7
        with:
          script: |
            const TITLE = '[链接健康检查] 失效链接报告';
            const fs = require('fs');
            let report = '';
            try { report = fs.readFileSync('lychee-report.md', 'utf8'); } catch (e) {}
            const exitCode = '${{ steps.lychee.outputs.exit_code }}';

            // 仅当报告中确实存在非零错误计数时才判定为链接失效，
            // 避免 lychee 自身报错（如参数不兼容）导致误报
            const errMatch = report.match(/(\d+)\s+errors?/i);
            const errorCount = errMatch ? parseInt(errMatch[1], 10) : 0;
            const failed = exitCode !== '0' && errorCount > 0;

            if (exitCode !== '0' && errorCount === 0) {
              core.warning('lychee 异常退出但报告无错误计数（可能为工具自身问题），本次不开 Issue。报告片段：' + report.slice(0, 200));
            }

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', per_page: 100
            });
            const existing = issues.data.find(i => i.title === TITLE);

            if (!failed) {
              core.info(`链接检查通过（exit_code=${exitCode}, errors=${errorCount}）`);
              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'closed',
                  body: (existing.body || '') + '\n\n---\n✅ 最新一次检查全部通过（errors=0），已自动关闭。'
                });
              }
              return;
            }

            const body = [
              `## ⚠️ 检测到 ${errorCount} 个失效链接`,
              '',
              '以下链接在最近一次检查中不可访问，请修复或移除：',
              '',
              (report || '详见 workflow 运行日志').slice(0, 50000),
              '',
              '---',
              `_由 link-check workflow 自动创建/更新 · ${new Date().toISOString().slice(0,10)}_`
            ].join('\n');

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body
              });
              core.info('已更新既有报告 Issue #' + existing.number);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: TITLE, body, labels: ['link-check']
              });
            }
